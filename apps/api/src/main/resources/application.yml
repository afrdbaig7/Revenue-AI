spring:
  application:
    name: recoverai-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/recoverai}
    username: ${DATABASE_USERNAME:recoverai}
    password: ${DATABASE_PASSWORD:recoverai_dev}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: recoverai-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: recoverai-recovery-worker
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
      properties:
        max.poll.interval.ms: 300000

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

management:
  tracing:
    enabled: ${TRACING_ENABLED:false}  # enable in prod w/ OTEL_EXPORTER_OTLP_ENDPOINT set
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    redis:
      # Redis is optional in demo/dev (locks/rate-limit layer); PostgreSQL remains the
      # system of record. Enable the Redis health check in production deployments.
      enabled: ${REDIS_HEALTH_ENABLED:false}
  metrics:
    tags:
      application: recoverai-api

springdoc:
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

recoverai:
  demo-mode: ${DEMO_MODE:false}
  event-dispatch-mode: ${EVENT_DISPATCH_MODE:inline}   # inline | kafka
  temporal:
    enabled: ${TEMPORAL_ENABLED:false}
    target: ${TEMPORAL_TARGET:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:recoverai}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    api-base: ${RAZORPAY_API_BASE:https://api.razorpay.com}
    mock-mode: ${RAZORPAY_MOCK_MODE:true}
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    allowed-hosts: ${RAZORPAY_ALLOWED_HOSTS:api.razorpay.com}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8100}
    timeout-ms: 8000
    enabled: ${AI_ENABLED:true}
  jwt:
    issuer: ${JWT_ISSUER:recoverai-local}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    secure-cookies: ${JWT_SECURE_COOKIES:false}
  encryption:
    key: ${ENCRYPTION_KEY:dev-only-32-byte-encryption-key-123456}
  scheduling:
    outbox-poll-ms: 1000
    action-poll-ms: 5000
    reconcile-poll-ms: 30000
    snapshot-cron: "0 0 * * * *"

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.recoverai: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] [%X{traceId}] %logger{36} - %msg%n"
