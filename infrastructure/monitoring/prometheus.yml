global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: recoverai-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels: { service: recoverai-api }
  - job_name: recoverai-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["worker:8080"]
        labels: { service: recoverai-worker }
  - job_name: recoverai-ai
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8100"]
        labels: { service: recoverai-ai }

# --- Alerts ----------------------------------------------------------------
rule_files:
  - /etc/prometheus/alerts.yml
