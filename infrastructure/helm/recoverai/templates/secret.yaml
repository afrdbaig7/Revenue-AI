apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recoverai.fullname" . }}-secrets
  labels: {{ include "recoverai.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.postgres.url | quote }}
  DATABASE_USERNAME: {{ .Values.postgres.username | quote }}
  DATABASE_PASSWORD: {{ .Values.postgres.password | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  ENCRYPTION_KEY: {{ .Values.security.encryptionKey | quote }}
  INTERNAL_API_KEY: {{ .Values.security.internalApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recoverai.fullname" . }}-ai-secrets
  labels: {{ include "recoverai.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.ai.openaiApiKey | quote }}
  INTERNAL_API_KEY: {{ .Values.security.internalApiKey | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recoverai.fullname" . }}-api-auth-secrets
  labels: {{ include "recoverai.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SIGNING_KEY: {{ .Values.security.jwtSigningKey | quote }}
