apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recoverai.fullname" . }}-secrets
  labels: {{ include "recoverai.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.postgres.url | quote }}
  DATABASE_USERNAME: {{ .Values.postgres.username | quote }}
  DATABASE_PASSWORD: {{ .Values.postgres.password | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  RAZORPAY_KEY_ID: {{ .Values.razorpay.keyId | quote }}
  RAZORPAY_KEY_SECRET: {{ .Values.razorpay.keySecret | quote }}
  RAZORPAY_WEBHOOK_SECRET: {{ .Values.razorpay.webhookSecret | quote }}
  ENCRYPTION_KEY: {{ .Values.security.encryptionKey | quote }}
  OPENAI_API_KEY: {{ .Values.ai.openaiApiKey | quote }}
