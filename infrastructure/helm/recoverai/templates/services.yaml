apiVersion: v1
kind: Service
metadata:
  name: {{ include "recoverai.fullname" . }}-api
  labels: {{ include "recoverai.labels" . | nindent 4 }}
spec:
  selector: { app: {{ include "recoverai.fullname" . }}-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "recoverai.fullname" . }}-ai
  labels: {{ include "recoverai.labels" . | nindent 4 }}
spec:
  selector: { app: {{ include "recoverai.fullname" . }}-ai }
  ports: [{ port: 80, targetPort: 8100 }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "recoverai.fullname" . }}-web
  labels: {{ include "recoverai.labels" . | nindent 4 }}
spec:
  selector: { app: {{ include "recoverai.fullname" . }}-web }
  ports: [{ port: 80, targetPort: 3000 }]
