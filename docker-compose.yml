# ============================================================================
# RecoverAI — local development infrastructure
#
#   docker compose up -d            # postgres, redis, redpanda, temporal, observability
#   docker compose --profile apps up -d   # + backend, ai-service, web (Docker build)
#   docker compose --profile minio up -d  # + object storage (optional)
#
# Application services may also run locally against this infra (recommended
# for fastest iteration):  make dev
# ============================================================================
name: recoverai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai_dev
      POSTGRES_DB: recoverai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverai -d recoverai"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.3.4
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "9093:9092"
      - "29093:29092"
      - "9645:9644"
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls 127.0.0.1:9644 || exit 0"]
      interval: 10s
      timeout: 10s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      - DB=postgres12_pgx
      - DB_PORT=5432
      - POSTGRES_USER=recoverai
      - POSTGRES_PWD=recoverai_dev
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7234:7233"

  temporal-ui:
    image: temporalio/ui:2.32.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal
    ports:
      - "8089:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9091:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: recoverai
      MINIO_ROOT_PASSWORD: recoverai_dev
    profiles: ["minio"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # --- Application services (optional; run natively for fastest dev) ----------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["apps"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/recoverai
      DATABASE_USERNAME: recoverai
      DATABASE_PASSWORD: recoverai_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      TEMPORAL_ENABLED: "false"
      TEMPORAL_TARGET: temporal:7233
      DEMO_MODE: "true"
      EVENT_DISPATCH_MODE: inline
      RAZORPAY_MOCK_MODE: "true"
      AI_SERVICE_BASE_URL: http://ai-service:8100
      AI_ENABLED: "true"
      ENCRYPTION_KEY: "docker-32-byte-encryption-key-1234567890"
      JWT_ISSUER: recoverai-docker
      JWT_SECURE_COOKIES: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    profiles: ["apps"]
    environment:
      LLM_PROVIDER: none
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: ["apps"]
    environment:
      API_PROXY_TARGET: http://api:8080
      NEXT_PUBLIC_API_BASE: /api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rpdata:
  promdata:
  grafanadata:
  miniodata:
